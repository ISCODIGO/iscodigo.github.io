<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notación de Chen paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#18212F; --muted:#5A6576; --line:#8792A2;
  --hair:#DCE2EA; --hi:#2457D6; --hi-bg:#E3EBFD; --shape:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
main{max-width:820px;margin:0 auto;padding:2.5rem 1.25rem 3rem}
h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.15;margin:0 0 .5rem;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 1.75rem;max-width:62ch}
.phases{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem;padding:0;list-style:none}
.phases li{font-size:.9rem;padding:.35rem .8rem;border:1px solid var(--hair);border-radius:999px;color:var(--muted);transition:all .3s}
.phases li.on{background:var(--hi-bg);color:var(--hi);border-color:var(--hi);font-weight:700}
.phases li.done{color:var(--ink)}
.stage{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:1rem;overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:520px}
.el{transition:opacity .5s}
.el.fut{opacity:0}
.el.past{opacity:.35}
.sh{fill:var(--shape);stroke:var(--line);stroke-width:1;transition:stroke .35s,stroke-width .35s}
.ln{fill:none;stroke:var(--line);stroke-width:1.1;transition:stroke .35s,stroke-width .35s}
.hl .sh,.hl .ln{stroke:var(--hi);stroke-width:2.2}
.tx{font-size:12px;fill:var(--ink);font-family:inherit}
.txb{font-size:13px;font-weight:700;fill:var(--ink);font-family:inherit}
.card{font-size:16px;font-weight:700;fill:var(--hi);font-family:inherit}
@media (prefers-reduced-motion:no-preference){.hl{animation:pul 1.6s ease-in-out infinite}}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.65}}
.caption{min-height:6.5rem;margin:1.25rem 0 0}
.caption h2{font-size:1.2rem;margin:0 0 .3rem}
.caption p{margin:0;color:var(--muted);max-width:66ch}
.controls{display:flex;align-items:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--hair);
  border-radius:8px;padding:.5rem .9rem;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{border-color:var(--line)}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button.primary{background:var(--hi);color:var(--card);border-color:var(--hi)}
.count{margin-left:auto;color:var(--muted);font-size:.9rem}
.bar{height:3px;background:var(--hair);border-radius:2px;margin-top:1rem;overflow:hidden}
.bar span{display:block;height:100%;background:var(--hi);width:0;transition:width .4s}
.hint{color:var(--muted);font-size:.85rem;margin-top:1.5rem}
</style>
</head>
<body>
<main>
<ol class="phases" aria-label="Fases">
  <li id="ph1">1. Entidades</li>
  <li id="ph2">2. Atributos</li>
  <li id="ph3">3. Relaciones</li>
</ol>

<div class="stage">
<svg viewBox="0 0 680 560" role="img" aria-labelledby="svgt svgd"><title id="svgt">Diagrama de Chen construido por fases</title><desc id="svgd">Empleado, departamento, proyecto y subordinado con sus atributos y relaciones</desc>
<g class="el k-comp"><ellipse class="sh" cx="115" cy="62" rx="40" ry="14"/><text class="tx" x="115" y="62" text-anchor="middle" dominant-baseline="central">NombreP</text>
<ellipse class="sh" cx="225" cy="62" rx="42" ry="14"/><text class="tx" x="225" y="62" text-anchor="middle" dominant-baseline="central">Apellido1</text>
<line class="ln" x1="130" y1="75" x2="155" y2="108"/><line class="ln" x1="210" y1="75" x2="185" y2="108"/>
<ellipse class="sh" cx="170" cy="120" rx="38" ry="14"/><text class="tx" x="170" y="120" text-anchor="middle" dominant-baseline="central">Nombre</text>
<line class="ln" x1="165" y1="134" x2="155" y2="180"/></g>
<g class="el k-key"><ellipse class="sh" cx="60" cy="130" rx="28" ry="14"/><text class="tx" x="60" y="130" text-anchor="middle" dominant-baseline="central">Dni</text>
<line class="ln" x1="50" y1="139" x2="70" y2="139"/><line class="ln" x1="72" y1="143" x2="100" y2="180"/></g>
<g class="el k-simple"><ellipse class="sh" cx="250" cy="140" rx="34" ry="14"/><text class="tx" x="250" y="140" text-anchor="middle" dominant-baseline="central">Sueldo</text>
<line class="ln" x1="240" y1="154" x2="200" y2="180"/></g>
<g class="el k-der"><ellipse class="sh" cx="475" cy="120" rx="50" ry="14" stroke-dasharray="4 3"/><text class="tx" x="475" y="120" text-anchor="middle" dominant-baseline="central">NumEmpleados</text>
<line class="ln" x1="490" y1="134" x2="510" y2="180"/></g>
<g class="el k-multi"><ellipse class="sh" cx="600" cy="120" rx="52" ry="18"/><ellipse class="sh" cx="600" cy="120" rx="46" ry="13"/><text class="tx" x="600" y="120" text-anchor="middle" dominant-baseline="central">Ubicaciones</text>
<line class="ln" x1="592" y1="138" x2="578" y2="180"/></g>
<g class="el k-total k-rl"><line class="ln" x1="210" y1="195" x2="268" y2="195"/><line class="ln" x1="210" y1="201" x2="268" y2="201"/>
<line class="ln" x1="402" y1="195" x2="460" y2="195"/><line class="ln" x1="402" y1="201" x2="460" y2="201"/>
<path class="ln" d="M196 216V342H270"/><path class="ln" d="M204 216V334H270"/>
<line class="ln" x1="400" y1="335" x2="460" y2="335"/><line class="ln" x1="400" y1="341" x2="460" y2="341"/></g>
<g class="el k-total k-idl"><line class="ln" x1="97" y1="458" x2="97" y2="490"/><line class="ln" x1="103" y1="458" x2="103" y2="490"/></g>
<g class="el k-partial k-idl"><line class="ln" x1="100" y1="216" x2="100" y2="402"/></g>
<g class="el k-relattr"><ellipse class="sh" cx="335" cy="410" rx="32" ry="14"/><text class="tx" x="335" y="410" text-anchor="middle" dominant-baseline="central">Horas</text>
<line class="ln" x1="335" y1="364" x2="335" y2="396"/></g>
<g class="el k-pk"><ellipse class="sh" cx="262" cy="508" rx="38" ry="14"/><text class="tx" x="262" y="508" text-anchor="middle" dominant-baseline="central">Nombre</text>
<line class="ln" x1="241" y1="517" x2="283" y2="517" stroke-dasharray="3 2"/><line class="ln" x1="170" y1="508" x2="224" y2="508"/></g>
<g class="el k-rel"><polygon class="sh" points="265,198 335,172 405,198 335,224"/><text class="tx" x="335" y="198" text-anchor="middle" dominant-baseline="central">TRABAJA_PARA</text>
<polygon class="sh" points="265,338 335,312 405,338 335,364"/><text class="tx" x="335" y="338" text-anchor="middle" dominant-baseline="central">TRABAJA_EN</text></g>
<g class="el k-relw"><polygon class="sh" points="15,430 100,402 185,430 100,458"/><polygon class="sh" points="26,430 100,408 174,430 100,452"/><text class="tx" x="100" y="430" text-anchor="middle" dominant-baseline="central">SUBORDINADOS_DE</text></g>
<g class="el k-ent"><rect class="sh" x="80" y="180" width="130" height="36"/><text class="txb" x="145" y="198" text-anchor="middle" dominant-baseline="central">EMPLEADO</text>
<rect class="sh" x="460" y="180" width="150" height="36"/><text class="txb" x="535" y="198" text-anchor="middle" dominant-baseline="central">DEPARTAMENTO</text>
<rect class="sh" x="460" y="320" width="150" height="36"/><text class="txb" x="535" y="338" text-anchor="middle" dominant-baseline="central">PROYECTO</text></g>
<g class="el k-weak"><rect class="sh" x="30" y="490" width="140" height="36"/><rect class="sh" x="34" y="494" width="132" height="28"/><text class="txb" x="100" y="508" text-anchor="middle" dominant-baseline="central">SUBORDINADO</text></g>
<g class="el k-card"><text class="card" x="228" y="188">N</text><text class="card" x="446" y="188">1</text>
<text class="card" x="240" y="326">M</text><text class="card" x="440" y="326">N</text>
<text class="card" x="110" y="394">1</text><text class="card" x="110" y="480">N</text></g>
</svg>
</div>

<div class="caption" aria-live="polite">
  <h2 id="st"></h2>
  <p id="sd"></p>
</div>

<div class="controls">
  <button id="bp" aria-label="Paso anterior">&larr; Anterior</button>
  <button id="bplay" class="primary">Reproducir</button>
  <button id="bn" aria-label="Paso siguiente">Siguiente &rarr;</button>
  <span class="count" id="cnt"></span>
</div>
<div class="bar"><span id="bar"></span></div>
<p class="hint">También puedes usar las flechas del teclado para avanzar y retroceder, y la barra espaciadora para reproducir o pausar.</p>
</main>

<script>
const S=[
{p:1,k:['k-ent'],t:'Entidad fuerte: rectángulo simple',d:'Primero se identifican los objetos principales con existencia propia: EMPLEADO, DEPARTAMENTO y PROYECTO.'},
{p:1,k:['k-weak'],t:'Entidad débil: rectángulo doble',d:'SUBORDINADO también es una entidad, pero no tiene clave propia: dependerá de un empleado para identificarse.'},
{p:2,k:['k-simple'],t:'Atributo simple: óvalo',d:'Ahora describimos cada entidad. Sueldo es una propiedad con un único valor atómico.'},
{p:2,k:['k-key'],t:'Atributo clave: óvalo subrayado',d:'Identifica de forma única cada ocurrencia. Dos empleados nunca comparten Dni.'},
{p:2,k:['k-comp'],t:'Atributo compuesto: óvalo con sub-óvalos',d:'Nombre se descompone en partes: NombreP, Apellido1 (y Apellido2 en el original).'},
{p:2,k:['k-multi'],t:'Atributo multivaluado: óvalo doble',d:'Puede tener varios valores a la vez: un departamento tiene varias Ubicaciones.'},
{p:2,k:['k-der'],t:'Atributo derivado: óvalo punteado',d:'No se guarda, se calcula. NumEmpleados sale de contar los empleados del departamento.'},
{p:2,k:['k-pk'],t:'Clave parcial: subrayado discontinuo',d:'El Nombre del subordinado solo es único dentro de un mismo empleado, no en toda la base de datos.'},
{p:3,k:['k-rel'],r:['k-rl'],t:'Relación: rombo',d:'Por último conectamos las entidades. TRABAJA_PARA une empleados con departamentos; TRABAJA_EN, empleados con proyectos.'},
{p:3,k:['k-relw'],r:['k-idl'],t:'Relación identificadora: rombo doble',d:'Une la entidad débil con su dueña. Gracias a ella, un subordinado se identifica por el Dni del empleado más su Nombre.'},
{p:3,k:['k-relattr'],t:'Atributo de relación',d:'Horas no pertenece ni al empleado ni al proyecto, sino a la combinación de ambos: por eso cuelga del rombo.'},
{p:3,k:['k-total'],t:'Participación total: línea doble',d:'Toda ocurrencia debe participar: todo empleado trabaja para un departamento y todo subordinado depende de un empleado.'},
{p:3,k:['k-partial'],t:'Participación parcial: línea simple',d:'La participación es opcional: no todo empleado tiene subordinados a su cargo.'},
{p:3,k:['k-card'],t:'Cardinalidad: 1, N, M',d:'Indica cuántas ocurrencias se asocian: N:1 en TRABAJA_PARA, M:N en TRABAJA_EN y 1:N en SUBORDINADOS_DE.'},
{p:4,k:null,t:'Modelo completo',d:'Entidades, luego atributos, luego relaciones: ese es el orden recomendado para construir cualquier diagrama entidad-relación.'}
];
let i=0,tm=null;
const els=document.querySelectorAll('.el');
const $=id=>document.getElementById(id);
function show(n){
  i=(n+S.length)%S.length;const s=S[i];
  const rev=new Set();
  for(let j=0;j<=i;j++){(S[j].k||[]).forEach(x=>rev.add(x));(S[j].r||[]).forEach(x=>rev.add(x));}
  const cur=new Set([...(s.k||[]),...(s.r||[])]);
  els.forEach(e=>{
    const cl=[...e.classList];
    const isCur=cl.some(c=>cur.has(c));
    const isHl=!!s.k&&cl.some(c=>s.k.includes(c));
    const isRev=!s.k||cl.some(c=>rev.has(c));
    e.classList.toggle('fut',!isRev);
    e.classList.toggle('past',!!s.k&&isRev&&!isCur);
    e.classList.toggle('hl',isHl);
  });
  [1,2,3].forEach(p=>{const el=$('ph'+p);el.classList.toggle('on',s.p===p);el.classList.toggle('done',s.p>p);});
  $('st').textContent=s.t;
  $('sd').textContent=s.d;
  $('cnt').textContent='Paso '+(i+1)+' de '+S.length;
  $('bar').style.width=((i+1)/S.length*100)+'%';
}
function stop(){clearInterval(tm);tm=null;$('bplay').textContent='Reproducir';}
function toggle(){
  if(tm){stop();return;}
  $('bplay').textContent='Pausar';
  tm=setInterval(()=>show(i+1),4000);
}
$('bn').onclick=()=>{stop();show(i+1)};
$('bp').onclick=()=>{stop();show(i-1)};
$('bplay').onclick=toggle;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stop();show(i+1)}
  else if(e.key==='ArrowLeft'){stop();show(i-1)}
  else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}
});
show(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notación de Chen paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#18212F; --muted:#5A6576; --line:#8792A2;
  --hair:#DCE2EA; --hi:#2457D6; --hi-bg:#E3EBFD; --shape:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
main{max-width:820px;margin:0 auto;padding:2.5rem 1.25rem 3rem}
h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.15;margin:0 0 .5rem;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 1.75rem;max-width:62ch}
.phases{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem;padding:0;list-style:none}
.phases li{font-size:.9rem;padding:.35rem .8rem;border:1px solid var(--hair);border-radius:999px;color:var(--muted);transition:all .3s}
.phases li.on{background:var(--hi-bg);color:var(--hi);border-color:var(--hi);font-weight:700}
.phases li.done{color:var(--ink)}
.stage{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:1rem;overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:580px}
.el{transition:opacity .5s}
.el.fut{opacity:0}
.el.past{opacity:.35}
.sh{fill:var(--shape);stroke:var(--line);stroke-width:1;transition:stroke .35s,stroke-width .35s}
.ln{fill:none;stroke:var(--line);stroke-width:1.1;transition:stroke .35s,stroke-width .35s}
.hl .sh,.hl .ln{stroke:var(--hi);stroke-width:2.2}
.tx{font-size:12px;fill:var(--ink);font-family:inherit}
.txb{font-size:13px;font-weight:700;fill:var(--ink);font-family:inherit}
.card{font-size:16px;font-weight:700;fill:var(--hi);font-family:inherit}
@media (prefers-reduced-motion:no-preference){.hl{animation:pul 1.6s ease-in-out infinite}}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.65}}
.occ{margin:0}
.occ[hidden]{display:none}
.occ-h{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
#occsvg{min-width:560px}
#main.off{display:none}
.set{fill:var(--paper);stroke:var(--hair);stroke-width:1}
.setname{font-size:13px;font-weight:700;fill:var(--ink);font-family:inherit}
.dot{fill:var(--ink)}
.sq{fill:var(--hi)}
.lbl{font-size:13px;font-style:italic;fill:var(--ink);font-family:inherit}
.idle{font-size:13px;font-style:italic;fill:var(--muted);font-family:inherit}
.occ-ln{fill:none;stroke:var(--hi);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s ease-out}
.occ-ln.go{stroke-dashoffset:0}
.reading{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:.75rem;font-size:.95rem;opacity:0;transition:opacity .5s}
.reading.go{opacity:1}
.reading b{color:var(--hi)}
.reading h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .35rem}
.reading p{margin:0 0 .3rem}
.dot.off{fill:var(--card);stroke:var(--muted);stroke-width:1.2}
.lbl.off{fill:var(--muted)}
.res{display:inline-block;margin-top:.25rem;padding:.2rem .7rem;border-radius:999px;background:var(--hi-bg);color:var(--hi);font-weight:700}
@media (prefers-reduced-motion:reduce){.occ-ln,.reading{transition:none}}
.caption{min-height:6.5rem;margin:1.25rem 0 0}
.caption h2{font-size:1.2rem;margin:0 0 .3rem}
.caption p{margin:0;color:var(--muted);max-width:66ch}
.controls{display:flex;align-items:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--hair);
  border-radius:8px;padding:.5rem .9rem;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{border-color:var(--line)}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button.primary{background:var(--hi);color:var(--card);border-color:var(--hi)}
.count{margin-left:auto;color:var(--muted);font-size:.9rem}
.bar{height:3px;background:var(--hair);border-radius:2px;margin-top:1rem;overflow:hidden}
.bar span{display:block;height:100%;background:var(--hi);width:0;transition:width .4s}
.hint{color:var(--muted);font-size:.85rem;margin-top:1.5rem}

/* Ajuste: toda la simulación cabe en 900px de alto */
main{height:900px;max-height:900px;display:flex;flex-direction:column;padding:1rem 1.25rem;overflow:hidden}
.phases{margin:0 0 .6rem;flex:none}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:.75rem;overflow:hidden}
#main{flex:1 1 auto;min-height:0;min-width:0;width:100%;height:100%}
.occ:not([hidden]){flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#occsvg{flex:1 1 auto;min-height:0;min-width:0;width:100%;height:100%}
.occ-h{margin:0 0 .25rem}
.reading{flex:none;margin-top:.4rem;gap:.5rem 1rem;font-size:.9rem}
.reading p{margin:0 0 .15rem}
.caption{flex:none;min-height:4.8rem;margin:.75rem 0 0}
.caption h2{font-size:1.1rem}
.controls{flex:none;margin-top:.6rem}
.bar{flex:none;margin-top:.6rem}
.hint{flex:none;margin:.5rem 0 0;font-size:.8rem}
</style>
</head>

  b:'Cada subordinado depende de <b>exactamente 1</b> empleado.',res:'1 : N',
  pa:'e2 y e5 no tienen subordinados: EMPLEADO participa de forma <b>parcial</b>.',
  pb:'Todo subordinado depende de alguien: SUBORDINADO participa de forma <b>total</b> (siempre, por ser entidad débil).'}
};
const NS='http://www.w3.org/2000/svg';
function mk(tag,at,txt){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;return e;}
function sub(parent,x,y,pre,n,anchor,cls){const t=mk('text',{x,y,'text-anchor':anchor,'dominant-baseline':'central',class:cls||'lbl'});t.appendChild(document.createTextNode(pre));const ts=mk('tspan',{'baseline-shift':'sub','font-size':'10'},String(n));t.appendChild(ts);parent.appendChild(t);}
let occTimers=[];
function renderOcc(key){
  occTimers.forEach(clearTimeout);occTimers=[];
  const d=O[key],svg=document.getElementById('occsvg');svg.innerHTML='';
  const nL=d.L[2],nR=d.R[2],nP=d.P.length,n=Math.max(nL,nR,nP),gap=32,top=56;
  const H=top+n*gap+62;svg.setAttribute('viewBox','0 0 680 '+H);
  const cy=top+n*gap/2+8, ry=n*gap/2+30;
  const X=[130,340,550];
  [[X[0],d.L[0]],[X[1],d.rel],[X[2],d.R[0]]].forEach(([x,name])=>{
    svg.appendChild(mk('ellipse',{cx:x,cy,rx:62,ry,class:'set'}));
    svg.appendChild(mk('text',{x,y:22,'text-anchor':'middle',class:'setname'},name));
  });
  const ys=c=>Array.from({length:c},(_,i)=>top+(n-c)*gap/2+gap/2+i*gap);
  const yL=ys(nL),yR=ys(nR),yP=ys(nP);
  const g=mk('g',{});svg.appendChild(g);
  const lines=[];
  d.P.forEach(([l,r],i)=>{
    const a=mk('line',{x1:X[0]+6,y1:yL[l-1],x2:X[1],y2:yP[i],class:'occ-ln',pathLength:1});
    const b=mk('line',{x1:X[1],y1:yP[i],x2:X[2]-6,y2:yR[r-1],class:'occ-ln',pathLength:1});
    g.appendChild(a);g.appendChild(b);lines.push([a,b]);
  });
  const uL=new Set(d.P.map(q=>q[0])),uR=new Set(d.P.map(q=>q[1]));
  yL.forEach((y,i)=>{const on=uL.has(i+1);svg.appendChild(mk('circle',{cx:X[0]+6,cy:y,r:3.5,class:on?'dot':'dot off'}));sub(svg,X[0]-8,y,d.L[1],i+1,'end',on?'lbl':'lbl off');});
  yR.forEach((y,i)=>{const on=uR.has(i+1);svg.appendChild(mk('circle',{cx:X[2]-6,cy:y,r:3.5,class:on?'dot':'dot off'}));sub(svg,X[2]+8,y,d.R[1],i+1,'start',on?'lbl':'lbl off');});
  yP.forEach((y,i)=>{svg.appendChild(mk('rect',{x:X[1]-4,y:y-4,width:8,height:8,class:'sq'}));sub(svg,X[1]-12,y,'r',i+1,'end');});
  [X[0],X[1],X[2]].forEach(x=>svg.appendChild(mk('text',{x,y:cy+ry-16,'text-anchor':'middle',class:'idle'},'⋮')));
  document.getElementById('occh').textContent='Diagrama de ocurrencias de '+d.rel;
  const rd=document.getElementById('reading');rd.classList.remove('go');
  rd.innerHTML='<div><h3>Cardinalidad</h3><p>'+d.a+'</p><p>'+d.b+'</p><span class="res">'+d.res+'</span></div><div><h3>Participación</h3><p>'+d.pa+'</p><p>'+d.pb+'</p></div>';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(()=>{
    lines.forEach(([a,b],i)=>{
      if(reduce){a.classList.add('go');b.classList.add('go');return;}
      occTimers.push(setTimeout(()=>a.classList.add('go'),150+i*380));
      occTimers.push(setTimeout(()=>b.classList.add('go'),350+i*380));
    });
    occTimers.push(setTimeout(()=>rd.classList.add('go'),reduce?0:400+lines.length*380));
  });
}
let i=0,tm=null;
const els=document.querySelectorAll('.el');
const $=id=>document.getElementById(id);
function show(n){
  i=(n+S.length)%S.length;const s=S[i];
  const rev=new Set();
  for(let j=0;j<=i;j++){(S[j].k||[]).forEach(x=>rev.add(x));(S[j].r||[]).forEach(x=>rev.add(x));}
  const cur=new Set([...(s.k||[]),...(s.r||[])]);
  els.forEach(e=>{
    const cl=[...e.classList];
    const isCur=cl.some(c=>cur.has(c));
    const isHl=!!s.k&&cl.some(c=>s.k.includes(c));
    const isRev=!s.k||cl.some(c=>rev.has(c));
    e.classList.toggle('fut',!isRev);
    e.classList.toggle('past',!!s.k&&isRev&&!isCur);
    e.classList.toggle('hl',isHl);
  });
  [1,2,3].forEach(p=>{const el=$('ph'+p);el.classList.toggle('on',s.p===p);el.classList.toggle('done',s.p>p);});
  const oc=$('occ');if(s.o){oc.hidden=false;$('main').classList.add('off');renderOcc(s.o);}else{oc.hidden=true;$('main').classList.remove('off');}
  $('st').textContent=s.t;
  $('sd').textContent=s.d;
  $('cnt').textContent='Paso '+(i+1)+' de '+S.length;
  $('bar').style.width=((i+1)/S.length*100)+'%';
}
function stop(){clearTimeout(tm);tm=null;$('bplay').textContent='Reproducir';}
function toggle(){
  if(tm){stop();return;}
  $('bplay').textContent='Pausar';
  const tick=()=>{show(i+1);tm=setTimeout(tick,S[i].o?7500:4000);};tm=setTimeout(tick,S[i].o?7500:4000);
}
$('bn').onclick=()=>{stop();show(i+1)};
$('bp').onclick=()=>{stop();show(i-1)};
$('bplay').onclick=toggle;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stop();show(i+1)}
  else if(e.key==='ArrowLeft'){stop();show(i-1)}
  else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}
});
show(0);
</script>
</body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <linearGradient id="running-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blocked-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ready-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    Transición de Estados del Proceso en Operaciones de Semáforo
  </text>

  <rect x="275" y="70" width="250" height="80" rx="12" fill="url(#running-grad)" filter="url(#shadow)"/>
  <text x="400" y="105" text-anchor="middle" font-size="22" font-weight="bold" fill="white">🏃 EJECUTANDO</text>
  <text x="400" y="130" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.9)">(Running)</text>

  <rect x="50" y="280" width="250" height="80" rx="12" fill="url(#blocked-grad)" filter="url(#shadow)"/>
  <text x="175" y="315" text-anchor="middle" font-size="22" font-weight="bold" fill="white">⛔ BLOQUEADO</text>
  <text x="175" y="340" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.9)">(Blocked en s.queue)</text>

  <rect x="500" y="280" width="250" height="80" rx="12" fill="url(#ready-grad)" filter="url(#shadow)"/>
  <text x="625" y="315" text-anchor="middle" font-size="22" font-weight="bold" fill="white">✅ LISTO</text>
  <text x="625" y="340" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.9)">(Ready Queue)</text>

  <path d="M 330,150 C 250,195 200,220 185,275" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-red)"/>
  <rect x="165" y="190" width="195" height="50" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="262" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">semWait(s): s.count &lt; 0</text>
  <text x="262" y="228" text-anchor="middle" font-size="11" fill="#666">→ proceso se bloquea en s.queue</text>

  <path d="M 300,290 C 380,290 420,290 495,290" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-green)"/>
  <rect x="306" y="260" width="188" height="28" rx="6" fill="#eafaf1" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="400" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">semSignal(s) → despierta proceso</text>

  <path d="M 720,280 C 750,220 700,170 650,155" stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="658" y="195" width="120" height="28" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="718" y="214" text-anchor="middle" font-size="11" fill="#555">Planificador (dispatch)</text>

  <path d="M 530,130 C 600,180 620,220 640,275" stroke="#555" stroke-width="2.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="548" y="175" width="115" height="28" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="605" y="194" text-anchor="middle" font-size="11" fill="#555">Planificador (expulsión)</text>

  <rect x="190" y="410" width="420" height="90" rx="8" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="400" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Estructura del semáforo</text>
  <text x="400" y="454" text-anchor="middle" font-size="12" fill="#555">s.count = 1  (recursos disponibles)</text>
  <text x="400" y="474" text-anchor="middle" font-size="12" fill="#555">s.queue → [P2] [P3]... (procesos bloqueados)</text>
  <text x="400" y="494" text-anchor="middle" font-size="11" fill="#888">s.count ≥ 0: hay recursos | s.count &lt; 0: |s.count| procesos bloqueados</text>

  <rect x="40" y="410" width="130" height="70" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
  <text x="105" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Leyenda</text>
  <rect x="50" y="436" width="12" height="12" rx="2" fill="#e74c3c"/>
  <text x="68" y="447" font-size="11" fill="#555">semWait falla</text>
  <rect x="50" y="454" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="68" y="465" font-size="11" fill="#555">semSignal</text>
</svg>

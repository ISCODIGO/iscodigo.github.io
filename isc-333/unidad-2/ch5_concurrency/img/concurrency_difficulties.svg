<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0055b3"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="44" rx="6" fill="#0055b3"/>
  <text x="450" y="30" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">Dificultades de la Concurrencia</text>

  <!-- Three pillars -->
  <!-- Pillar 1 -->
  <rect x="25" y="65" width="270" height="200" rx="10" fill="#e8f0fe" stroke="#0055b3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="65" width="270" height="36" rx="10" fill="#0055b3"/>
  <rect x="25" y="85" width="270" height="16" fill="#0055b3"/>
  <text x="160" y="89" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Recursos Globales</text>
  <text x="160" y="118" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">Orden de acceso crítico</text>
  <text x="40" y="140" fill="#555" font-size="11">• Variables compartidas</text>
  <text x="40" y="158" fill="#555" font-size="11">• Buffers / archivos</text>
  <text x="40" y="176" fill="#555" font-size="11">• El scheduler decide</text>
  <text x="40" y="192" fill="#555" font-size="11">  el orden de acceso</text>
  <text x="40" y="215" fill="#888" font-size="10" font-style="italic">"...sin mecanismos de</text>
  <text x="40" y="230" fill="#888" font-size="10" font-style="italic"> sincronización adecuados"</text>

  <!-- Pillar 2 -->
  <rect x="315" y="65" width="270" height="200" rx="10" fill="#fef3e2" stroke="#e68a00" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="315" y="65" width="270" height="36" rx="10" fill="#e68a00"/>
  <rect x="315" y="85" width="270" height="16" fill="#e68a00"/>
  <text x="450" y="89" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Asignación Óptima</text>
  <text x="450" y="118" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">Difícil para el SO</text>
  <text x="330" y="140" fill="#555" font-size="11">• ¿Cuánta CPU dar a cada uno?</text>
  <text x="330" y="158" fill="#555" font-size="11">• Memoria insuficiente → swapping</text>
  <text x="330" y="176" fill="#555" font-size="11">• E/S impredecible</text>
  <text x="330" y="192" fill="#555" font-size="11">• Deadlock / starvation</text>
  <text x="330" y="215" fill="#888" font-size="10" font-style="italic">"...el SO no conoce las</text>
  <text x="330" y="230" fill="#888" font-size="10" font-style="italic"> necesidades futuras"</text>

  <!-- Pillar 3 -->
  <rect x="605" y="65" width="270" height="200" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="605" y="65" width="270" height="36" rx="10" fill="#d93025"/>
  <rect x="605" y="85" width="270" height="16" fill="#d93025"/>
  <text x="740" y="89" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Errores No Deterministas</text>
  <text x="740" y="118" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">"Heisenbugs"</text>
  <text x="620" y="140" fill="#555" font-size="11">• Resultados no reproducibles</text>
  <text x="620" y="158" fill="#555" font-size="11">• Desaparecen al depurar</text>
  <text x="620" y="176" fill="#555" font-size="11">  (cambia el timing)</text>
  <text x="620" y="192" fill="#555" font-size="11">• Los más costosos de corregir</text>
  <text x="620" y="215" fill="#888" font-size="10" font-style="italic">"Therac-25 (1985-87):</text>
  <text x="620" y="230" fill="#888" font-size="10" font-style="italic"> condiciones de carrera"</text>

  <!-- Connecting arrows between pillars -->
  <line x1="295" y1="165" x2="315" y2="165" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="165" x2="605" y2="165" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom section: Race Condition Visual -->
  <rect x="25" y="290" width="850" height="210" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="290" width="850" height="32" rx="10" fill="#1e1e2e"/>
  <rect x="25" y="310" width="850" height="12" fill="#1e1e2e"/>
  <text x="450" y="312" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Ejemplo Visual: Condición de Carrera en echo()</text>

  <!-- Process P1 -->
  <rect x="50" y="335" width="180" height="30" rx="6" fill="#0055b3" opacity="0.9"/>
  <text x="140" y="355" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Proceso P1</text>

  <!-- Process P2 -->
  <rect x="50" y="375" width="180" height="30" rx="6" fill="#e68a00" opacity="0.9"/>
  <text x="140" y="395" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Proceso P2</text>

  <!-- Shared Variable -->
  <rect x="50" y="415" width="180" height="30" rx="6" fill="#d93025" opacity="0.9"/>
  <text x="140" y="435" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Variable compartida</text>

  <!-- Timeline for P1 -->
  <line x1="260" y1="350" x2="840" y2="350" stroke="#0055b3" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- Timeline for P2 -->
  <line x1="260" y1="390" x2="840" y2="390" stroke="#e68a00" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Timeline for Shared -->
  <line x1="260" y1="430" x2="840" y2="430" stroke="#d93025" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: P1 reads -->
  <line x1="320" y1="335" x2="320" y2="430" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="320" cy="350" r="5" fill="#0055b3"/>
  <text x="320" y="345" text-anchor="middle" fill="#0055b3" font-size="9" font-weight="bold">1</text>
  <text x="320" y="470" text-anchor="middle" fill="#666" font-size="10">P1: chin = 'x'</text>

  <!-- Step 2: Interrupt P1 -->
  <line x1="400" y1="335" x2="400" y2="430" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="400" cy="350" r="5" fill="#0055b3"/>
  <text x="400" y="345" text-anchor="middle" fill="#0055b3" font-size="9" font-weight="bold">2</text>
  <rect x="385" y="360" width="30" height="18" rx="3" fill="#d93025"/>
  <text x="400" y="373" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">INT</text>
  <text x="382" y="470" text-anchor="middle" fill="#666" font-size="10">P1 interrumpido!</text>

  <!-- Step 3: P2 reads -->
  <line x1="490" y1="375" x2="490" y2="430" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="490" cy="390" r="5" fill="#e68a00"/>
  <text x="490" y="385" text-anchor="middle" fill="#e68a00" font-size="9" font-weight="bold">3</text>
  <text x="490" y="470" text-anchor="middle" fill="#666" font-size="10">P2: chin = getchar() → 'y'</text>

  <!-- Step 4: P2 writes -->
  <line x1="580" y1="375" x2="580" y2="430" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="580" cy="390" r="5" fill="#e68a00"/>
  <text x="580" y="385" text-anchor="middle" fill="#e68a00" font-size="9" font-weight="bold">4</text>
  <circle cx="580" cy="430" r="6" fill="#d93025"/>
  <text x="580" y="425" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">4</text>
  <text x="598" y="434" fill="#d93025" font-size="9" font-weight="bold">chin ← 'y'</text>
  <text x="580" y="470" text-anchor="middle" fill="#666" font-size="10">P2: chout = chin (sobrescribe 'x')</text>

  <!-- Step 5: P2 prints -->
  <line x1="670" y1="375" x2="670" y2="430" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="670" cy="390" r="5" fill="#e68a00"/>
  <text x="670" y="385" text-anchor="middle" fill="#e68a00" font-size="9" font-weight="bold">5</text>
  <text x="670" y="470" text-anchor="middle" fill="#666" font-size="10">P2: imprime 'y'</text>

  <!-- Step 6: P1 resumes uses wrong value -->
  <line x1="760" y1="335" x2="760" y2="430" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="760" cy="350" r="5" fill="#d93025"/>
  <text x="760" y="345" text-anchor="middle" fill="#d93025" font-size="9" font-weight="bold">X</text>
  <circle cx="760" cy="430" r="6" fill="#d93025"/>
  <text x="760" y="425" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">6</text>
  <text x="735" y="453" fill="#d93025" font-size="9" font-weight="bold">P1 usa 'y' en vez de 'x'</text>
  <text x="760" y="490" text-anchor="middle" fill="#d93025" font-size="10" font-weight="bold">→ Resultado: se pierde 'x', se imprime 'y' dos veces</text>

  <!-- Time labels -->
  <text x="285" y="505" fill="#888" font-size="9">t1</text>
  <text x="365" y="505" fill="#888" font-size="9">t2</text>
  <text x="455" y="505" fill="#888" font-size="9">t3</text>
  <text x="545" y="505" fill="#888" font-size="9">t4</text>
  <text x="635" y="505" fill="#888" font-size="9">t5</text>
  <text x="725" y="505" fill="#888" font-size="9">t6</text>
</svg>
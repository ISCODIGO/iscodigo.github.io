<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="55" rx="8" fill="#1a1a2e"/>
  <text x="450" y="35" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Algoritmo del Banquero (Dijkstra, 1965)</text>

  <!-- Banker story -->
  <rect x="30" y="75" width="840" height="100" rx="10" fill="#fff8e1" stroke="#ffe082" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" fill="#e65100" font-size="15" font-weight="bold">Analogía: El Banquero y los Clientes</text>
  <text x="450" y="122" text-anchor="middle" fill="#555" font-size="11.5">Un banquero tiene una cantidad fija de capital (recursos). Cada cliente (proceso) solicita préstamos (recursos)</text>
  <text x="450" y="142" text-anchor="middle" fill="#555" font-size="11.5">que debe devolver. El banquero solo aprueba un préstamo si, después de otorgarlo, aún puede satisfacer</text>
  <text x="450" y="162" text-anchor="middle" fill="#555" font-size="11.5">las necesidades máximas de todos los clientes (estado seguro). Si no, rechaza la solicitud (estado inseguro).</text>

  <!-- 3 States -->
  <rect x="30" y="195" width="270" height="180" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2"/>
  <text x="165" y="225" text-anchor="middle" fill="#2e7d32" font-size="15" font-weight="bold">Estado Seguro</text>
  <text x="165" y="250" text-anchor="middle" fill="#555" font-size="11">Existe una secuencia de</text>
  <text x="165" y="268" text-anchor="middle" fill="#555" font-size="11">ejecución donde todos</text>
  <text x="165" y="286" text-anchor="middle" fill="#555" font-size="11">los procesos pueden</text>
  <text x="165" y="304" text-anchor="middle" fill="#555" font-size="11">completarse sin deadlock</text>
  <text x="165" y="340" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="bold">→ El banquero aprueba</text>

  <rect x="315" y="195" width="270" height="180" rx="10" fill="#fff3e0" stroke="#ffcc80" stroke-width="2"/>
  <text x="450" y="225" text-anchor="middle" fill="#e65100" font-size="15" font-weight="bold">Estado Inseguro</text>
  <text x="450" y="250" text-anchor="middle" fill="#555" font-size="11">No hay garantía de que</text>
  <text x="450" y="268" text-anchor="middle" fill="#555" font-size="11">todos los procesos</text>
  <text x="450" y="286" text-anchor="middle" fill="#555" font-size="11">puedan completarse</text>
  <text x="450" y="304" text-anchor="middle" fill="#555" font-size="11">(posible deadlock)</text>
  <text x="450" y="340" text-anchor="middle" fill="#e65100" font-size="12" font-weight="bold">→ El banquero rechaza</text>

  <rect x="600" y="195" width="270" height="180" rx="10" fill="#ffebee" stroke="#ef9a9a" stroke-width="2"/>
  <text x="735" y="225" text-anchor="middle" fill="#c62828" font-size="15" font-weight="bold">Deadlock</text>
  <text x="735" y="250" text-anchor="middle" fill="#555" font-size="11">Ningún proceso puede</text>
  <text x="735" y="268" text-anchor="middle" fill="#555" font-size="11">progresar. Todos</text>
  <text x="735" y="286" text-anchor="middle" fill="#555" font-size="11">esperan recursos</text>
  <text x="735" y="304" text-anchor="middle" fill="#555" font-size="11">que nunca estarán</text>
  <text x="735" y="322" text-anchor="middle" fill="#555" font-size="11">disponibles</text>
  <text x="735" y="340" text-anchor="middle" fill="#c62828" font-size="12" font-weight="bold">→ Sistema detenido</text>

  <!-- Arrows between states -->
  <path d="M180,385 L180,405 L450,405 L450,385" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M450,385 L450,405 L735,405 L735,385" fill="none" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data structures -->
  <rect x="30" y="420" width="840" height="90" rx="8" fill="#f0f4f8" stroke="#cfd8dc" stroke-width="1"/>
  <text x="50" y="445" fill="#333" font-size="13" font-weight="bold">Estructuras de Datos (m procesos, n recursos):</text>
  
  <rect x="40" y="455" width="370" height="45" rx="5" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="50" y="475" fill="#1565c0" font-size="11" font-weight="bold">Available[1..m]</text>
  <text x="160" y="475" fill="#333" font-size="10.5">— Recursos disponibles actualmente</text>

  <rect x="420" y="455" width="210" height="45" rx="5" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="430" y="475" fill="#2e7d32" font-size="11" font-weight="bold">Max[i, j]</text>
  <text x="495" y="475" fill="#333" font-size="10.5">— Demanda máxima</text>

  <rect x="640" y="455" width="220" height="45" rx="5" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="650" y="475" fill="#e65100" font-size="11" font-weight="bold">Allocation[i, j]</text>
  <text x="740" y="475" fill="#333" font-size="10.5">— Recursos asignados</text>

  <text x="450" y="502" text-anchor="middle" fill="#888" font-size="10.5">Need[i,j] = Max[i,j] - Allocation[i,j] → Recursos que aún necesita el proceso i del recurso j</text>
</svg>

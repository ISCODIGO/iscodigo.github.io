<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ee4444;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa726;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff8f00;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#43a047;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e88e5;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="60" rx="8" fill="#1a1a2e"/>
  <text x="450" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Condiciones de Coffman (1971) — Las 4 Condiciones Necesarias para Deadlock</text>
  <rect x="30" y="80" width="195" height="180" rx="12" fill="url(#g1)" opacity="0.95"/>
  <circle cx="127" cy="115" r="22" fill="white" opacity="0.3"/>
  <text x="127" y="122" text-anchor="middle" fill="white" font-size="18" font-weight="bold">1</text>
  <text x="127" y="160" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Exclusión Mutua</text>
  <text x="127" y="185" text-anchor="middle" fill="white" font-size="11.5">Los recursos no pueden</text>
  <text x="127" y="205" text-anchor="middle" fill="white" font-size="11.5">ser compartidos</text>
  <text x="127" y="230" text-anchor="middle" fill="white" font-size="10.5" opacity="0.85">(modo exclusivo)</text>
  <rect x="40" y="248" width="175" height="1" fill="white" opacity="0.3"/>
  <rect x="245" y="80" width="195" height="180" rx="12" fill="url(#g2)" opacity="0.95"/>
  <circle cx="342" cy="115" r="22" fill="white" opacity="0.3"/>
  <text x="342" y="122" text-anchor="middle" fill="white" font-size="18" font-weight="bold">2</text>
  <text x="342" y="160" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Retener y Esperar</text>
  <text x="342" y="185" text-anchor="middle" fill="white" font-size="11.5">Un proceso retiene</text>
  <text x="342" y="205" text-anchor="middle" fill="white" font-size="11.5">recursos asignados</text>
  <text x="342" y="230" text-anchor="middle" fill="white" font-size="10.5" opacity="0.85">mientras espera otros</text>
  <rect x="255" y="248" width="175" height="1" fill="white" opacity="0.3"/>
  <rect x="460" y="80" width="195" height="180" rx="12" fill="url(#g3)" opacity="0.95"/>
  <circle cx="557" cy="115" r="22" fill="white" opacity="0.3"/>
  <text x="557" y="122" text-anchor="middle" fill="white" font-size="18" font-weight="bold">3</text>
  <text x="557" y="160" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Sin Desalojo</text>
  <text x="557" y="185" text-anchor="middle" fill="white" font-size="11.5">Los recursos no</text>
  <text x="557" y="205" text-anchor="middle" fill="white" font-size="11.5">pueden ser quitados</text>
  <text x="557" y="230" text-anchor="middle" fill="white" font-size="10.5" opacity="0.85">forzosamente</text>
  <rect x="470" y="248" width="175" height="1" fill="white" opacity="0.3"/>
  <rect x="675" y="80" width="195" height="180" rx="12" fill="url(#g4)" opacity="0.95"/>
  <circle cx="772" cy="115" r="22" fill="white" opacity="0.3"/>
  <text x="772" y="122" text-anchor="middle" fill="white" font-size="18" font-weight="bold">4</text>
  <text x="772" y="160" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Espera Circular</text>
  <text x="772" y="185" text-anchor="middle" fill="white" font-size="11.5">Existe un ciclo</text>
  <text x="772" y="205" text-anchor="middle" fill="white" font-size="11.5">en el grafo de</text>
  <text x="772" y="230" text-anchor="middle" fill="white" font-size="10.5" opacity="0.85">asignación de recursos</text>
  <rect x="685" y="248" width="175" height="1" fill="white" opacity="0.3"/>
  <text x="450" y="300" text-anchor="middle" fill="#555" font-size="14">Todas las 4 condiciones deben cumplirse simultáneamente para que ocurra un deadlock</text>
  <rect x="250" y="315" width="400" height="50" rx="25" fill="#1a1a2e"/>
  <text x="450" y="347" text-anchor="middle" fill="#ff6b6b" font-size="16" font-weight="bold">Deadlock = Cond1 ∧ Cond2 ∧ Cond3 ∧ Cond4</text>
  <rect x="100" y="385" width="320" height="110" rx="10" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="260" y="415" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Sin Deadlock</text>
  <text x="260" y="440" text-anchor="middle" fill="#666" font-size="11">Si alguna condición no se cumple</text>
  <text x="260" y="460" text-anchor="middle" fill="#666" font-size="11">no puede haber deadlock</text>
  <rect x="480" y="385" width="320" height="110" rx="10" fill="#fff5f5" stroke="#ffcccc" stroke-width="1"/>
  <text x="640" y="415" text-anchor="middle" fill="#cc3333" font-size="14" font-weight="bold">Posible Deadlock</text>
  <text x="640" y="440" text-anchor="middle" fill="#666" font-size="11">Si las 4 condiciones se cumplen</text>
  <text x="640" y="460" text-anchor="middle" fill="#666" font-size="11">puede haber deadlock (no es</text>
  <text x="640" y="480" text-anchor="middle" fill="#666" font-size="11">suficiente, pero es necesario)</text>
</svg>

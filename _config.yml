remote_theme: sighingnow/jekyll-gitbook
title: "IsCodigo | Blog"
description: "Blog de Enrique Avila | UNAH"
url: "https://iscodigo.github.io"
logo: "assets/logo.png"

# Configuración de navegación
search_enabled: true
syntax_highlighter_style: github

# Índice de encabezados dentro de la página activa
toc:
  enabled: true
  h_min: 2
  h_max: 3

# Los diagramas se activan por página con `mermaid: true` en el front matter;
# el tema fija la versión de la librería, aquí no se configura.

lang: "es"

# Estética
color_scheme: light

# Apuntes de referencia, no son páginas del sitio. Contienen llaves dobles
# que Liquid intenta interpretar y rompen la compilación.
exclude:
  - isc-211/books/
  - isc-321/books/
  # Presentaciones Marp: el fuente de las diapositivas, no páginas del sitio.
  - isc-333/unidad-1/hilos/
  - isc-333/unidad-3/cap7/
  - isc-333/unidad-3/cap8/
